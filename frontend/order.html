<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Trạng thái đơn - CloudMenu</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="header">
    <div>
      <p
        id="order-table-label"
        class="eyebrow"
      >
        Đang xác định bàn...
      </p>

      <h1>Trạng thái đơn</h1>

      <p class="subtitle">
        Theo dõi tiến trình chuẩn bị món
      </p>
    </div>

    <a
      id="back-to-menu-link"
      href="index.html"
      class="cart-button"
    >
      Quay lại menu
    </a>
  </header>

  <main class="container">
    <section class="order-status-card">
      <div class="order-top-row">
        <div>
          <p class="eyebrow">Mã đơn</p>

          <h2 id="order-id">
            Chưa có đơn
          </h2>
        </div>

        <span
          id="order-status-badge"
          class="order-status-badge"
        >
          Đã gửi đơn
        </span>
      </div>

      <div class="status-timeline">
        <div class="status-step active">
          <span>1</span>

          <div>
            <strong>Đã gửi đơn</strong>

            <p>
              Nhà hàng đã nhận đơn gọi món.
            </p>
          </div>
        </div>

        <div class="status-step">
          <span>2</span>

          <div>
            <strong>Đang chế biến</strong>

            <p>
              Bếp đang chuẩn bị món ăn.
            </p>
          </div>
        </div>

        <div class="status-step">
          <span>3</span>

          <div>
            <strong>Đã hoàn thành</strong>

            <p>
              Món ăn đã sẵn sàng để phục vụ.
            </p>
          </div>
        </div>
      </div>

      <div
        id="order-summary"
        class="order-summary"
      ></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    const API_URL =
      "https://zcbix27iq9.execute-api.us-east-1.amazonaws.com";

    const storedOrder = JSON.parse(
      localStorage.getItem("cloudmenu-order")
    );

    const urlParams =
      new URLSearchParams(window.location.search);

    const tableFromUrl =
      urlParams.get("table");

    const orderIdFromUrl =
      urlParams.get("orderId");

    const orderIdElement =
      document.querySelector("#order-id");

    const orderSummary =
      document.querySelector("#order-summary");

    const orderStatusBadge =
      document.querySelector(
        "#order-status-badge"
      );

    const orderTableLabel =
      document.querySelector(
        "#order-table-label"
      );

    const backToMenuLink =
      document.querySelector(
        "#back-to-menu-link"
      );

    const toast =
      document.querySelector("#toast");

    let currentOrder = storedOrder;
    let isLoading = false;

    function normalizeTableNumber(value) {
      if (!value) {
        return null;
      }

      const normalizedValue =
        String(value).trim();

      if (!/^\d+$/.test(normalizedValue)) {
        return null;
      }

      return normalizedValue.padStart(2, "0");
    }

    function getCurrentTableNumber() {
      const normalizedTableFromUrl =
        normalizeTableNumber(
          tableFromUrl
        );

      const tableFromOrder =
        normalizeTableNumber(
          currentOrder?.tableNumber
        );

      return (
        normalizedTableFromUrl ||
        tableFromOrder ||
        null
      );
    }

    function getCurrentOrderId() {
      return (
        orderIdFromUrl ||
        currentOrder?.orderId ||
        null
      );
    }

    function updateTableInformation() {
      const currentTableNumber =
        getCurrentTableNumber();

      if (!currentTableNumber) {
        orderTableLabel.textContent =
          "Chưa xác định bàn";

        backToMenuLink.href =
          "index.html";

        return;
      }

      orderTableLabel.textContent =
        `Bàn số ${currentTableNumber}`;

      backToMenuLink.href =
        `index.html?table=${encodeURIComponent(
          currentTableNumber
        )}`;
    }

    function formatCurrency(value) {
      const formattedValue =
        new Intl.NumberFormat("vi-VN").format(
          Number(value) || 0
        );

      return `${formattedValue} VND`;
    }

    function getStatusText(status) {
      const statusMap = {
        PENDING: "Đã gửi đơn",
        PREPARING: "Đang chế biến",
        COMPLETED: "Đã hoàn thành",
      };

      return (
        statusMap[status] ||
        "Không xác định"
      );
    }

    function renderStatus(status) {
      const steps =
        document.querySelectorAll(
          ".status-step"
        );

      const statusIndexMap = {
        PENDING: 0,
        PREPARING: 1,
        COMPLETED: 2,
      };

      const activeIndex =
        statusIndexMap[status] ?? 0;

      steps.forEach(
        (step, index) => {
          step.classList.toggle(
            "active",
            index <= activeIndex
          );
        }
      );

      orderStatusBadge.textContent =
        getStatusText(status);
    }

    function renderEmptyOrder() {
      orderIdElement.textContent =
        "Chưa có đơn";

      orderStatusBadge.textContent =
        "Không có dữ liệu";

      orderSummary.innerHTML = `
        <p class="empty-cart">
          Chưa có đơn gọi món nào.
        </p>
      `;
    }

    function renderOrderDetails() {
      if (!currentOrder) {
        renderEmptyOrder();
        return;
      }

      orderIdElement.textContent =
        currentOrder.orderId ||
        "Không có mã đơn";

      renderStatus(
        currentOrder.status
      );

      const items =
        Array.isArray(currentOrder.items)
          ? currentOrder.items
          : [];

      orderSummary.innerHTML = `
        <h3>Chi tiết đơn</h3>

        ${
          items.length > 0
            ? items
                .map(
                  (item) => `
                    <div class="summary-item">
                      <span>
                        ${
                          item.name ||
                          "Món không xác định"
                        }
                        ×
                        ${
                          Number(
                            item.quantity
                          ) || 0
                        }
                      </span>

                      <strong>
                        ${formatCurrency(
                          (Number(
                            item.price
                          ) || 0) *
                          (Number(
                            item.quantity
                          ) || 0)
                        )}
                      </strong>
                    </div>
                  `
                )
                .join("")
            : `
              <p class="empty-cart">
                Đơn hàng chưa có món.
              </p>
            `
        }

        <div class="total-row">
          <span>Tổng cộng</span>

          <strong>
            ${formatCurrency(
              currentOrder.totalAmount
            )}
          </strong>
        </div>
      `;
    }

    function showToast(message) {
      toast.textContent = message;

      toast.classList.add(
        "visible"
      );

      window.setTimeout(() => {
        toast.classList.remove(
          "visible"
        );
      }, 2000);
    }

    async function loadLatestOrder() {
      const currentOrderId =
        getCurrentOrderId();

      if (
        !currentOrderId ||
        isLoading
      ) {
        return;
      }

      isLoading = true;

      try {
        const response = await fetch(
          `${API_URL}/orders`,
          {
            method: "GET",

            headers: {
              Accept: "application/json",
            },
          }
        );

        if (!response.ok) {
          throw new Error(
            `Máy chủ trả về lỗi ${response.status}`
          );
        }

        const data =
          await response.json();

        const orders =
          Array.isArray(data)
            ? data
            : Array.isArray(data?.orders)
              ? data.orders
              : [];

        const latestOrder =
          orders.find(
            (order) =>
              order.orderId ===
              currentOrderId
          );

        if (!latestOrder) {
          return;
        }

        currentOrder =
          latestOrder;

        localStorage.setItem(
          "cloudmenu-order",
          JSON.stringify(
            latestOrder
          )
        );

        updateTableInformation();
        renderOrderDetails();
      } catch (error) {
        console.error(
          "LOAD ORDER ERROR:",
          error
        );
      } finally {
        isLoading = false;
      }
    }

    updateTableInformation();
    renderOrderDetails();

    loadLatestOrder();

    window.setInterval(() => {
      loadLatestOrder();
    }, 5000);
  </script>
</body>
</html>
