<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudMenu</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="header">
    <div>
      <p class="eyebrow">Bàn số 05</p>
      <h1>CloudMenu</h1>
      <p class="subtitle">Chọn món và gọi món ngay tại bàn</p>
    </div>

    <button id="cart-button" class="cart-button">
      Giỏ hàng
      <span id="cart-count">0</span>
    </button>
  </header>

  <main class="container">
    <section class="toolbar">
      <input
        id="search-input"
        type="search"
        placeholder="Tìm món ăn..."
      />

      <div id="category-list" class="category-list"></div>
    </section>

    <section>
      <div class="section-heading">
        <h2>Thực đơn</h2>
        <span id="menu-count"></span>
      </div>

      <div id="menu-list" class="menu-grid"></div>
    </section>
  </main>

  <aside id="cart-panel" class="cart-panel">
    <div class="cart-header">
      <div>
        <p class="eyebrow">Bàn số 05</p>
        <h2>Đơn gọi món</h2>
      </div>

      <button id="close-cart" class="icon-button" aria-label="Đóng">
        ×
      </button>
    </div>

    <div id="cart-items" class="cart-items"></div>

    <div class="cart-footer">
      <div class="total-row">
        <span>Tổng cộng</span>
        <strong id="cart-total">0 ₫</strong>
      </div>

      <button id="submit-order" class="primary-button">
        Gửi đơn gọi món
      </button>
    </div>
  </aside>

  <div id="overlay" class="overlay"></div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
